name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: poetry
          cache-dependency-path: poetry.lock
      - name: Install Poetry
        run: pipx install poetry
      - name: Install lint dependencies
        run: poetry install --only dev --no-root
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: poetry
          cache-dependency-path: poetry.lock
      # The unit suite only needs the lightweight runtime deps; the heavy ones
      # (torch/ultralytics/faster-whisper/ollama/yt-dlp) are imported lazily and
      # never reached by the tests, so we skip the multi-GB CUDA wheels here.
      - name: Install Poetry
        run: pipx install poetry
      - name: Install test dependencies
        run: poetry install --only ci --no-root
      - name: Run tests with coverage
        run: poetry run pytest --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
